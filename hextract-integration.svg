<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1090" viewBox="0 0 1200 1090" role="img" aria-labelledby="title desc">
  <title id="title">Binary Lab × hextract 集成方案</title>
  <desc id="desc">设计示意，非已实现界面。上部为原生格式解码架构，中部为 Bytes 格式解包界面，下部为分阶段交付与边界。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#5abdb5"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;fill:#e4ebf5;font-size:15px}
      .title{font-size:28px;font-weight:700}.section{font-size:19px;font-weight:700}.bold{font-weight:700}
      .muted{fill:#a9b9cf}.small{font-size:13px}.mono{font-family:Consolas,'Microsoft YaHei',monospace;font-size:14px}
      .panel{fill:#172234;stroke:#34465f;stroke-width:1}.node{fill:#21324a;stroke:#567292;stroke-width:1}
      .accent{fill:#142f34;stroke:#5abdb5;stroke-width:1}.line{fill:none;stroke:#5abdb5;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="1090" fill="#0d1523"/>
  <text x="36" y="48" class="title">Binary Lab × hextract</text>
  <text x="36" y="77" class="muted">原生集成方案 · Bytes 从标量解释扩展到格式驱动的记录分析</text>
  <rect x="1000" y="26" width="164" height="32" rx="7" fill="#47391e"/>
  <text x="1082" y="48" text-anchor="middle" fill="#f4cf82">设计示意 · 尚未实现</text>

  <rect x="24" y="100" width="1152" height="268" rx="12" class="panel"/>
  <text x="44" y="131" class="section">01 / 数据与模块边界</text>
  <rect x="44" y="153" width="208" height="67" rx="8" class="node"/>
  <text x="148" y="181" text-anchor="middle" class="bold">TOML 格式</text>
  <text x="148" y="204" text-anchor="middle" class="small muted">记录长度 · 字段 · 数组 · 规则</text>
  <path d="M252 186 H284" class="line"/>
  <rect x="286" y="153" width="222" height="67" rx="8" class="node"/>
  <text x="397" y="181" text-anchor="middle" class="bold">校验并编译布局</text>
  <text x="397" y="204" text-anchor="middle" class="small muted">一次计算偏移，不使用 C ABI 对齐</text>
  <path d="M508 186 H600 V254" class="line"/>
  <rect x="44" y="256" width="208" height="66" rx="8" class="node"/>
  <text x="148" y="282" text-anchor="middle" class="bold">原始 HEX → 字节</text>
  <text x="148" y="305" text-anchor="middle" class="small muted">严格分隔符 · 保留来源位置</text>
  <path d="M252 289 H284" class="line"/>
  <rect x="286" y="256" width="222" height="66" rx="8" class="node"/>
  <text x="397" y="282" text-anchor="middle" class="bold">切分 256 / 512 bit 记录</text>
  <text x="397" y="305" text-anchor="middle" class="small muted">ILA 顺序按整记录反转字节</text>
  <path d="M508 289 H534" class="line"/>
  <rect x="536" y="256" width="204" height="66" rx="8" class="accent"/>
  <text x="638" y="282" text-anchor="middle" class="bold">字段解码 + 位切片</text>
  <text x="638" y="305" text-anchor="middle" class="small muted">复用标量类型能力表</text>
  <path d="M740 289 H768" class="line"/>
  <rect x="770" y="256" width="181" height="66" rx="8" class="node"/>
  <text x="860" y="282" text-anchor="middle" class="bold">受限规则评估</text>
  <text x="860" y="305" text-anchor="middle" class="small muted">首个匹配 · 运算预算</text>
  <path d="M951 289 H977" class="line"/>
  <rect x="979" y="256" width="177" height="66" rx="8" class="node"/>
  <text x="1067" y="282" text-anchor="middle" class="bold">表格 / 筛选</text>
  <text x="1067" y="305" text-anchor="middle" class="small muted">倍率只影响显示</text>
  <text x="44" y="348" class="small muted">记录用字节数组，不新增 512 bit 整数；原始值／位切片值／显示值分层，不执行 Python。</text>

  <rect x="24" y="386" width="1152" height="471" rx="12" class="panel"/>
  <text x="44" y="418" class="section">02 / Bytes 页面草图</text>
  <rect x="44" y="437" width="1112" height="38" rx="5" fill="#22324a"/>
  <text x="60" y="462" class="muted">Bits</text>
  <rect x="117" y="442" width="77" height="28" rx="4" fill="#285b62"/>
  <text x="155" y="462" text-anchor="middle" class="bold">Bytes</text>
  <text x="218" y="462" class="muted">Struct</text>
  <text x="1042" y="462" class="muted">设置　帮助</text>
  <text x="60" y="503" class="muted">标量解码</text>
  <rect x="152" y="482" width="105" height="29" rx="5" fill="#285b62"/>
  <text x="204" y="503" text-anchor="middle">格式解包</text>
  <text x="282" y="503" class="mono">blm_interlock_512 ▾</text>
  <text x="531" y="503" class="small muted">[导入格式]</text>
  <text x="690" y="503" class="small">输入排列：ILA MSB-first ▾</text>
  <text x="1000" y="503" class="small muted">[载入数据]*</text>
  <rect x="60" y="526" width="1080" height="67" rx="6" fill="#101a29" stroke="#435974"/>
  <text x="74" y="551" class="mono">00000000 00000000 … FFFFFFFB … 00000002 000000C8 00000064</text>
  <text x="74" y="577" class="small muted">多行 HEX 输入 · 支持粘贴 · 示例省略，不代表完整记录</text>
  <text x="60" y="621" class="small">搜索 [ integral0                    ]　[✓ 仅异常]　[下一个异常]</text>
  <text x="886" y="621" class="small muted">图例：负积分 / 计数 / 全零</text>
  <rect x="60" y="639" width="1080" height="33" fill="#293b54"/>
  <text x="75" y="661" class="mono">记录号   状态       wr_time_s    data_id    integral0    integral1    count0   …</text>
  <rect x="60" y="672" width="1080" height="33" fill="#1b2c3e"/>
  <text x="75" y="694" class="mono">0        计数            100        0x1            1            2         7</text>
  <rect x="60" y="705" width="1080" height="33" fill="#50323d"/>
  <rect x="600" y="707" width="120" height="29" fill="none" stroke="#f4cf82" stroke-width="2"/>
  <text x="75" y="727" class="mono">1        负积分          100        0x2           -5            2         0</text>
  <text x="60" y="765" class="small">记录 #1 · 起始偏移 0x40 · integral0 · 字段偏移 +0x10 · i32 · 原始字节 FB FF FF FF</text>
  <rect x="60" y="780" width="148" height="31" rx="5" class="accent"/>
  <text x="134" y="801" text-anchor="middle" class="small">查看 Bits 位模式 →</text>
  <text x="236" y="801" class="small">[复制值]　[复制记录]</text>
  <text x="60" y="839" class="small muted">* 文件载入属于后续阶段；首期单工作区只读浏览。Bits / Struct 保持各自职责。</text>

  <rect x="24" y="875" width="1152" height="193" rx="12" class="panel"/>
  <text x="44" y="907" class="section">03 / 分阶段交付</text>
  <rect x="44" y="927" width="248" height="63" rx="7" class="node"/>
  <text x="60" y="952" class="bold">A · 格式与解码内核</text>
  <text x="60" y="975" class="small muted">两个格式逐字段差分测试</text>
  <path d="M292 958 H324" class="line"/>
  <rect x="326" y="927" width="248" height="63" rx="7" class="node"/>
  <text x="342" y="952" class="bold">B · 只读 GUI</text>
  <text x="342" y="975" class="small muted">记录表 · 详情 · 联动 Bits</text>
  <path d="M574 958 H606" class="line"/>
  <rect x="608" y="927" width="248" height="63" rx="7" class="node"/>
  <text x="624" y="952" class="bold">C · 规则与异常体验</text>
  <text x="624" y="975" class="small muted">受限语法 · 图例 · 异常导航</text>
  <path d="M856 958 H888" class="line"/>
  <rect x="890" y="927" width="266" height="63" rx="7" class="node"/>
  <text x="906" y="952" class="bold">D · 导入与多工作区</text>
  <text x="906" y="975" class="small muted">真实沙箱验证后接入文件操作</text>
  <text x="44" y="1020" class="small muted">B 先建立表格与字段联动；筛选及规则相关控件在 C 接入，不显示无响应按钮。</text>
  <text x="44" y="1046" class="small" fill="#f4cf82">前置：确认复用许可证；性能上限与权限基于实测，不因集成而默认放宽现有约束。</text>
</svg>
